<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: rgb(233, 225, 225);
            text-align: center;
            background-color: pink;
            background-image: linear-gradient(to bottom, rgb(15 23 42 / 50% ), rgb(15 23 42 / 40% )), url('https://png.pngtree.com/thumb_back/fh260/background/20241010/pngtree-raindrops-on-colorful-autumn-leaves-a-seasonal-delightautumn-splendor-and-vibrant-image_16334380.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        h1{
            font-size: 4em;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            /* text-shadow: 5px 5px 0 rgb(194, 194, 194); */
            background-image: linear-gradient(to right, hsl(175, 97%, 61%), rgb(238, 88, 238));
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(51, 206, 193, 0.61));
        }
        .quote{
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
            background-color: rgb(255 255 255/ 5%);
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgb(255 255 255 / 10%);
            box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
        }
        span{
            color: rgb(14, 12, 12);
            text-decoration: none;
            text-shadow: 0 0 10px rgb(221, 49, 83) ;
        }
        .author{
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(151 151 151/70%);
            font-weight: normal;
            text-transform: uppercase;
            border-top: 1px solid rgb(255 255 255 / 20%);
            width: 30%;
            margin: 30px auto;
            padding-top: 20px;
        }
    </style>

</head>

<body>
    <h1>Rintik Rindu</h1>
    <p class="quote">
        "Tak perlu cemas, ku hanya <span>menunggu</span>.<br>
        Sembari menghiasi rindu di relungku.<br>
        namun apakah kau masih untukku??<br>
        namun tetap saja kau akan ku tunggu"
    </p>
    
    <p class="author">- Alito Qoimpruy</p>
</body>
</html>
