<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Text - Text Overflow & Text Shadow</title>
    <style>
        p{
            font-size: 26px;
            white-space: nowrap;
            width: 300px;
            background-color: lightblue;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        h1{
            font-size: 100px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            text-shadow: 5px 10px 5px lightblue, -10px 5px red;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: lightcoral;
            text-decoration-skip-ink: none;
        }
    </style>
</head>
<body>
    <h1>Hello, CSS!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quis architecto dolorum unde sunt minus nesciunt, molestias et eum, nihil perferendis dolor atque, ex nam sed recusandae? Cumque veniam repellat asperiores.</p>
</body>
</html>
