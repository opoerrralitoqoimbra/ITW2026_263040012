<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba CSS - Font Styling</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double:wght@100..900&family=Black+Ops+One&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Redaction+100:ital,wght@0,400;0,700;1,400&display=swap');
        @font-face {
            font-family: Lobster;
            src: url('fots/LobsterTwo-Reguler.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    h1 {
        color: rgb(12, 1, 3);
        font-size: 100px;
        text-align: center;
        font-family: "Bitcount Prop Double", system, sans-serif
    }

    p{
        color:rgb(148, 111, 182);
        text-align: center;
        font-size: 20px;
        font-family: algerian;
    }
    .font-lobster{
        font-family: Lobster, arial, sans-serif;
    }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quo neque laboriosam voluptatum iure maiores corporis quisquam ex quis dicta fuga.</p>
    <p class="font-lobster">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quo neque laboriosam voluptatum iure maiores corporis quisquam ex quis dicta fuga.</p>
</body>
</html>
