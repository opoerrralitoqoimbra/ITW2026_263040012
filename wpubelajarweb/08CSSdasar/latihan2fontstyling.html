<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: rgb(107, 107, 107);
            text-align: center;
        }
        h1{
            font-size: 48px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: darkgrey;
            text-shadow: 5px 5px 0 rgb(90, 227, 255);
        }
        .quote{
            font-size: 22px;
            line-height: 2,2;
            word-spacing: 5px;
        }
        span{
            color: rgb(86, 112, 230);
            text-decoration: line-through;
        }
        .author{
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(126, 208, 255);
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Rintik Rindu</h1>
    <p class="quote">
        "Tak perlu cemas, ku hanya <span>menunggu</span>.<br>
        Sembari menghiasi rindu di relungku.<br>
        namun apakah kau masih untukku??<br>
        namun tetap saja kau akan ku tunggu"
    </p>
    
    <p class="author">- Alito Qoimpruy</p>
</body>
</html>
