<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coba elemen form</title>
</head>
<body>
    <h1>contoh elemen elemen form dalam html</h1>

    <form>
        <label for="nama">Nama:
        <input type="text" id="nama" name="nama" placeholder="masukkan nama">
        </label>
        <br>
        <label for="password">Password:
        <input type="password" id="password" name="password" placeholder="masukkan password">
        </label>
        <br>
        <label for="email">Email:
        <input type="email" id="email" name="email" placeholder="masukkan email ">
        </label>
        <br>
        <label for="angka">Angka:
        <input type="number" id="angka" name="angka" min="0" max="100" step="5">
        </label>
        <br>
        <label for="tanggal">Tanggal:
        <input type="date" id="tanggal" name="tanggal">
        </label>
        <br>
        <label for="warna">Warna:
        <input type="color" id="warna" name="warna">
        </label>
        <br>
        <button type="submit">kirim!</button>
        </br>
    </form>
    
</body>
</html>
