<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coba elemen form di dalam tabel</title>
</head>
<body>
    <h1>contoh elemen elemen form dalam html</h1>

    <form>
        <table>
            <tr>
                <td><label for="nama">Nama:</label></td>
                <td><input type="text" id="nama" name="nama" placeholder="masukkan nama"></td>
            </tr>
            <tr>
                <td><label for="password">Password:</label></td>
                <td><input type="password" id="password" name="password" placeholder="masukkan password"></td>
            </tr>
            <tr>
                <td><label for="email">Email:</label></td>
                <td><input type="email" id="email" name="email" placeholder="masukkan email"></td>
            </tr>
            <tr>
                <td><label for="angka">Angka:</label></td>
                <td><input type="number" id="angka" name="angka" min="0" max="100" step="5"></td>
            </tr>
            <tr>
                <td><label for="tanggal">Tanggal:</label></td>
                <td><input type="date" id="tanggal" name="tanggal"></td>
            </tr>
            <tr>
                <td><label for="warna">Warna:</label></td>
                <td><input type="color" id="warna" name="warna"></td>
            </tr>
            <tr>
                <td></td>
                <td><button type="submit">kirim!</button></td>
            </tr>
        </table>
       
</body>
</html>
