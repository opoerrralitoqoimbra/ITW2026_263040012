<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contoh input atribut, checkbox & radio</title>
</head>
<body>
    <h1>contoh input atribut, checkbox & radio</h1>
    <form>
        <label for="nama">Nama:
        <input type="text" id="nama" name="nama" placeholder="masukkan nama" autocomplete="off" autofocus required>
        </label>
        <br>
        <h3>hobby</h3>
        <label for="hobby1">
            <input type="checkbox" id="hobby1" name="hobby" value="membaca">
            membaca
        </label>
        <br>
        <label for="hobby2">
            <input type="checkbox" id="hobby2" name="hobby" value="olahraga">
            olahraga
        </label>
        <br>
        <label for="hobby3">
            <input type="checkbox" id="hobby3" name="hobby" value="musik">
            musik
        </label>
        <br>
        <h2>Jenis Kelamin</h2>
        <label for="kelamin">Jenis Kelamin:</label>
            <input type="radio" id="kelamin1" name="kelamin" value="laki-laki">
            <label for="kelamin1">Laki-laki</label>
            <input type="radio" id="kelamin2" name="kelamin" value="perempuan">
            <label for="kelamin2">Perempuan</label>
        </label>
        <br>
        <button type="submit">kirim!</button>
    </form>
</body>
</html>
